[package]
name = "systemhealthcheck"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "SystemHealthCheck - Linux Laptop Diagnostic & Performance Center"
license = "MIT"
authors = ["Tanmay Srivastava"]

[[bin]]
name = "SystemHealthCheck"
path = "src/main.rs"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_6"] }
cairo-rs = { version = "0.22", features = ["pdf"] }
pangocairo = "0.22"
async-channel = "2"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
libc = "0.2"

[dev-dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
